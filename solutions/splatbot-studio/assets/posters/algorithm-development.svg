<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm Development</title>
  <desc id="desc">SplatLab poster with original activities for writing and improving step-by-step robot algorithms.</desc>
  <rect width="900" height="1200" rx="36" fill="#f4fff7"/>
  <rect x="24" y="24" width="852" height="1152" rx="28" fill="none" stroke="#16a34a" stroke-width="16"/>
  <text x="450" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#16a34a" stroke="#111827" stroke-width="4" paint-order="stroke">Algorithm</text>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#16a34a" stroke="#111827" stroke-width="4" paint-order="stroke">Development</text>
  <text x="450" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#166534">Build steps. Test them. Improve them.</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#172033">
    <g transform="translate(80 315)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">1</text><text x="92" y="50" font-weight="900">Step Route</text><text x="92" y="84">ordered commands</text></g>
    <g transform="translate(490 315)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">?</text><text x="92" y="50" font-weight="900">If Wall Plan</text><text x="92" y="84">rule for barriers</text></g>
    <g transform="translate(80 465)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">↻</text><text x="92" y="50" font-weight="900">Loop Builder</text><text x="92" y="84">shorter algorithm</text></g>
    <g transform="translate(490 465)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">⛑</text><text x="92" y="50" font-weight="900">Rescue Plan</text><text x="92" y="84">recover after bump</text></g>
    <g transform="translate(80 615)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">★</text><text x="92" y="50" font-weight="900">Finish Signal</text><text x="92" y="84">light, sound, send</text></g>
    <g transform="translate(490 615)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">~</text><text x="92" y="50" font-weight="900">Rough Fix</text><text x="92" y="84">survive jitter</text></g>
    <g transform="translate(80 765)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">⇱</text><text x="92" y="50" font-weight="900">Phone Tilt</text><text x="92" y="84">controller as sensor</text></g>
    <g transform="translate(490 765)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">A/B</text><text x="92" y="50" font-weight="900">Two Tests</text><text x="92" y="84">compare versions</text></g>
    <g transform="translate(80 915)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">⏪</text><text x="92" y="50" font-weight="900">Trace Revision</text><text x="92" y="84">find first trouble</text></g>
    <g transform="translate(490 915)"><rect width="330" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="5"/><text x="35" y="70" font-size="40">▶</text><text x="92" y="50" font-weight="900">Teach Robot</text><text x="92" y="84">record, then edit</text></g>
  </g>
  <text x="450" y="1110" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#16a34a">Good algorithms get better through testing.</text>
</svg>
