<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Decomposition</title>
  <desc id="desc">SplatLab poster with original activities for breaking large robot problems into smaller parts.</desc>
  <rect width="900" height="1200" rx="36" fill="#fff7f7"/>
  <rect x="24" y="24" width="852" height="1152" rx="28" fill="none" stroke="#dc2626" stroke-width="16"/>
  <rect x="48" y="48" width="804" height="1104" rx="24" fill="none" stroke="#fecaca" stroke-width="4" stroke-dasharray="14 12"/>
  <text x="450" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="82" font-weight="900" fill="#dc2626" stroke="#111827" stroke-width="4" paint-order="stroke">Decomposition</text>
  <text x="450" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#991b1b">Split the mission into small jobs.</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#172033">
    <g transform="translate(80 270)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">1</text><text x="100" y="55" font-weight="900">Robot Route Chunks</text><text x="100" y="90">start, middle, finish</text></g>
    <g transform="translate(490 270)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">2</text><text x="100" y="55" font-weight="900">Backpack Bot</text><text x="100" y="90">pockets become tasks</text></g>
    <g transform="translate(80 430)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">3</text><text x="100" y="55" font-weight="900">Obstacle Cleanup</text><text x="100" y="90">solve one zone first</text></g>
    <g transform="translate(490 430)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">4</text><text x="100" y="55" font-weight="900">Sound Show Parts</text><text x="100" y="90">move, light, sound</text></g>
    <g transform="translate(80 590)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">5</text><text x="100" y="55" font-weight="900">Debug Pieces</text><text x="100" y="90">find the first break</text></g>
    <g transform="translate(490 590)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">6</text><text x="100" y="55" font-weight="900">Delivery Phases</text><text x="100" y="90">pickup, travel, drop</text></g>
    <g transform="translate(80 750)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">7</text><text x="100" y="55" font-weight="900">Sensor Job Split</text><text x="100" y="90">check, then act</text></g>
    <g transform="translate(490 750)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">8</text><text x="100" y="55" font-weight="900">Map Maker</text><text x="100" y="90">rows, walls, goal</text></g>
    <g transform="translate(80 910)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">9</text><text x="100" y="55" font-weight="900">Team Roles</text><text x="100" y="90">driver, checker, tester</text></g>
    <g transform="translate(490 910)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#dc2626" stroke-width="5"/><circle cx="52" cy="62" r="28" fill="#fee2e2"/><text x="52" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#dc2626">10</text><text x="100" y="55" font-weight="900">Program Labels</text><text x="100" y="90">setup, repeat, finish</text></g>
  </g>
  <text x="450" y="1110" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#dc2626">Small parts make big missions possible.</text>
</svg>
