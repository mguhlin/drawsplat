<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pattern Recognition</title>
  <desc id="desc">SplatLab poster with original activities for finding repeated robot programming patterns.</desc>
  <rect width="900" height="1200" rx="36" fill="#f7fbff"/>
  <rect x="24" y="24" width="852" height="1152" rx="28" fill="none" stroke="#2563eb" stroke-width="16"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="#2563eb" stroke="#111827" stroke-width="4" paint-order="stroke">Pattern Recognition</text>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1d4ed8">Find what repeats, matches, or changes.</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#172033">
    <g transform="translate(80 265)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">↻</text><text x="95" y="55" font-weight="900">Repeat Road</text><text x="95" y="90">move-turn pairs</text></g>
    <g transform="translate(490 265)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">?</text><text x="95" y="55" font-weight="900">Sensor Rhythm</text><text x="95" y="90">check before turns</text></g>
    <g transform="translate(80 425)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">#</text><text x="95" y="55" font-weight="900">Grid Steps</text><text x="95" y="90">same distance rule</text></g>
    <g transform="translate(490 425)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">♪</text><text x="95" y="55" font-weight="900">Sound Beat Bot</text><text x="95" y="90">sound + movement</text></g>
    <g transform="translate(80 585)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">▦</text><text x="95" y="55" font-weight="900">Path Rules</text><text x="95" y="90">rows and corners</text></g>
    <g transform="translate(490 585)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">!</text><text x="95" y="55" font-weight="900">Bug Pattern Hunt</text><text x="95" y="90">same cause repeats</text></g>
    <g transform="translate(80 745)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">☀</text><text x="95" y="55" font-weight="900">Schedule Robot</text><text x="95" y="90">daily event loops</text></g>
    <g transform="translate(490 745)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">◇</text><text x="95" y="55" font-weight="900">Dance Loop</text><text x="95" y="90">repeat a phrase</text></g>
    <g transform="translate(80 905)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">✉</text><text x="95" y="55" font-weight="900">Message Sequence</text><text x="95" y="90">ready, moving, done</text></g>
    <g transform="translate(490 905)"><rect width="330" height="130" rx="18" fill="#fff" stroke="#2563eb" stroke-width="5"/><text x="32" y="72" font-size="44">≈</text><text x="95" y="55" font-weight="900">Almost the Same</text><text x="95" y="90">compare changes</text></g>
  </g>
  <text x="450" y="1110" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#2563eb">Patterns help code become shorter and smarter.</text>
</svg>
