name: PlanSplat student planner
on:
  push:
    branches: [main]
    paths: ['splatworks/plansplat/**', 'splatworks/shared/google-drive-auth.js', 'assets/js/widget-i18n.js', 'tests/plansplat*', 'playwright.plansplat.config.js', '.github/workflows/plansplat.yml']
  pull_request:
    paths: ['splatworks/plansplat/**', 'splatworks/shared/google-drive-auth.js', 'assets/js/widget-i18n.js', 'tests/plansplat*', 'playwright.plansplat.config.js', '.github/workflows/plansplat.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/plansplat-model.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.plansplat.config.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plansplat-proof
          path: test-results/plansplat/
