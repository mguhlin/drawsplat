name: BackdropSplat background removal
on:
  push:
    branches: [main]
    paths: ['solutions/backdropsplat/**', 'solutions/imagesplat/**', 'tests/imagesplat-background*', 'tests/backdropsplat*', 'playwright.backdropsplat.config.cjs', '.github/workflows/backdropsplat.yml']
  pull_request:
    paths: ['solutions/backdropsplat/**', 'solutions/imagesplat/**', 'tests/imagesplat-background*', 'tests/backdropsplat*', 'playwright.backdropsplat.config.cjs', '.github/workflows/backdropsplat.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/backdropsplat-pixels.test.mjs
      - name: Use the runner's installed Chrome
        run: |
          browser_path="$(command -v google-chrome)"
          echo "BROWSER_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version
      - run: npx playwright test --config playwright.backdropsplat.config.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backdropsplat-proof
          path: .tmp/backdropsplat/
