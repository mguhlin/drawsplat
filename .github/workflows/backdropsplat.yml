name: BackdropSplat background removal
on:
  push:
    branches: [main]
    paths: ['solutions/backdropsplat/**', 'solutions/imagesplat/**', 'tests/imagesplat-background*', 'tests/backdropsplat*', 'playwright.backdropsplat.config.cjs', '.github/workflows/backdropsplat.yml']
  pull_request:
    paths: ['solutions/backdropsplat/**', 'solutions/imagesplat/**', 'tests/imagesplat-background*', 'tests/backdropsplat*', 'playwright.backdropsplat.config.cjs', '.github/workflows/backdropsplat.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/backdropsplat-pixels.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.backdropsplat.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backdropsplat-proof
          path: .tmp/backdropsplat/
