name: SplatWorks file interoperability
on:
  push:
    branches: [main]
    paths: ['splatworks/**', 'tests/splatworks-file-routing.spec.js', 'tests/gridsplat-cache.spec.js', 'tests/writesplat-ruler.spec.js', '.github/workflows/splatworks-interop.yml']
  pull_request:
    paths: ['splatworks/**', 'tests/splatworks-file-routing.spec.js', 'tests/gridsplat-cache.spec.js', 'tests/writesplat-ruler.spec.js', '.github/workflows/splatworks-interop.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci && npm test && npm run build
        working-directory: splatworks/writesplat
      - run: npm ci && npm test && npm run build
        working-directory: splatworks/listsplat
      - run: node scripts/check-splatworks-builds.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/splatworks-file-routing.spec.js tests/gridsplat-cache.spec.js tests/writesplat-ruler.spec.js --workers=2
      - run: npx playwright test tests/office-formats.spec.js --project=chromium
        working-directory: splatworks/showsplat
