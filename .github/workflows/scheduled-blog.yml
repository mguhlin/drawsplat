name: Scheduled SplatWorks blog publication
on:
  push:
    branches: [main]
    paths: ['functions/_lib/scheduled-blog/**', 'functions/blog/**', 'functions/_middleware.js', 'scripts/build-scheduled-blog.py', 'scripts/site_navigation.py', 'tests/scheduled-blog.test.mjs', 'assets/plansplat-blog/**', '_routes.json', '.github/workflows/scheduled-blog.yml']
  pull_request:
    paths: ['functions/_lib/scheduled-blog/**', 'functions/blog/**', 'functions/_middleware.js', 'scripts/build-scheduled-blog.py', 'scripts/site_navigation.py', 'tests/scheduled-blog.test.mjs', 'assets/plansplat-blog/**', '_routes.json', '.github/workflows/scheduled-blog.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install 'markdown-it-py>=3,<5'
      - run: python scripts/build-scheduled-blog.py --check
      - run: node --test tests/scheduled-blog.test.mjs
      - run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/scheduled-blog-worker.js
