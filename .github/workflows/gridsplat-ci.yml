name: GridSplat CI

on:
  push:
    branches: [main]
    paths:
      - 'splatworks/gridsplat/**'
      - 'splatworks/shared/**'
      - '.github/workflows/gridsplat-ci.yml'
  pull_request:
    paths:
      - 'splatworks/gridsplat/**'
      - 'splatworks/shared/**'
      - '.github/workflows/gridsplat-ci.yml'

permissions:
  contents: read

concurrency:
  group: gridsplat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splatworks/gridsplat

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: splatworks/gridsplat/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
