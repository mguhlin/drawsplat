name: GridSplat CI

on:
  push:
    branches: [main]
    paths:
      - 'gridsplat/**'
      - '.github/workflows/gridsplat-ci.yml'
  pull_request:
    paths:
      - 'gridsplat/**'
      - '.github/workflows/gridsplat-ci.yml'

permissions:
  contents: read

concurrency:
  group: gridsplat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridsplat

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gridsplat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
