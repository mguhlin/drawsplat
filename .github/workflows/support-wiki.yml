name: Support wiki consistency
on:
  push:
    branches: [main]
    paths: ['wiki/**', 'guides/**', 'legal/**', 'docs/**', 'pages/**', 'scripts/build-support-wiki.py', 'scripts/policy_content.py', 'data/policy-legacy-links.json', 'assets/css/policy.css', 'assets/js/policy.js', 'scripts/build-tool-features.py', 'data/tool-features.json', 'data/drawsplat-tools.json', 'scripts/build-district-guide.py', 'scripts/site_navigation.py', 'scripts/build-site-navigation.py', 'assets/css/site-navigation.css', 'assets/js/site-navigation.js', 'assets/js/district-components.js', 'assets/js/support-*.js', 'assets/js/wiki-language.js', 'assets/css/support-wiki.css', 'tests/support-wiki.spec.js', 'tests/ecosystem-naming.spec.js', 'tests/protect-privacy.spec.js', 'scripts/build-privacy-controls.py', 'scripts/check-privacy-coverage.cjs', 'assets/js/privacy-controls.js', 'assets/js/privacy-center.js', 'assets/js/protect-review.js', 'assets/css/privacy-controls.css', 'assets/css/privacy-center.css', 'data/privacy-*.json', 'privacy/**', '_headers', 'tests/splatworks-short-urls.spec.js', 'assets/js/privacy-builder.js', 'assets/js/consent-banner.js', '.github/workflows/support-wiki.yml']
  pull_request:
    paths: ['wiki/**', 'guides/**', 'legal/**', 'docs/**', 'pages/**', 'scripts/build-support-wiki.py', 'scripts/policy_content.py', 'data/policy-legacy-links.json', 'assets/css/policy.css', 'assets/js/policy.js', 'scripts/build-tool-features.py', 'data/tool-features.json', 'data/drawsplat-tools.json', 'scripts/site_navigation.py', 'scripts/build-site-navigation.py', 'assets/css/site-navigation.css', 'assets/js/site-navigation.js', 'assets/js/district-components.js', 'assets/js/support-*.js', 'assets/js/wiki-language.js', 'assets/css/support-wiki.css', 'tests/ecosystem-naming.spec.js', 'tests/protect-privacy.spec.js', 'scripts/build-privacy-controls.py', 'scripts/check-privacy-coverage.cjs', 'assets/js/privacy-controls.js', 'assets/js/privacy-center.js', 'assets/js/protect-review.js', 'assets/css/privacy-controls.css', 'assets/css/privacy-center.css', 'data/privacy-*.json', 'privacy/**', '_headers', 'tests/splatworks-short-urls.spec.js', 'assets/js/privacy-builder.js', 'assets/js/consent-banner.js', '.github/workflows/support-wiki.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install 'markdown-it-py>=3,<5'
      - run: python scripts/build-district-guide.py && python scripts/build-support-wiki.py
      - run: python scripts/build-privacy-controls.py --check && node scripts/check-privacy-coverage.cjs
      - run: git diff --exit-code
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test tests/support-wiki.spec.js tests/district-quickstart.spec.js tests/site-navigation.spec.js tests/splatworks-short-urls.spec.js tests/ecosystem-naming.spec.js tests/protect-privacy.spec.js --workers=2
