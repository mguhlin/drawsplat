name: Support wiki consistency
on:
  push:
    branches: [main]
    paths: ['wiki/**', 'guides/**', 'legal/**', 'docs/**', 'pages/**', 'scripts/build-support-wiki.py', 'scripts/build-district-guide.py', 'scripts/site_navigation.py', 'scripts/build-site-navigation.py', 'assets/css/site-navigation.css', 'assets/js/site-navigation.js', 'assets/js/support-*.js', 'assets/css/support-wiki.css', 'tests/support-wiki.spec.js', '.github/workflows/support-wiki.yml']
  pull_request:
    paths: ['wiki/**', 'guides/**', 'legal/**', 'docs/**', 'pages/**', 'scripts/build-support-wiki.py', 'scripts/site_navigation.py', 'scripts/build-site-navigation.py', 'assets/css/site-navigation.css', 'assets/js/site-navigation.js', 'assets/js/support-*.js', 'assets/css/support-wiki.css']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install 'markdown-it-py>=3,<5'
      - run: python scripts/build-district-guide.py && python scripts/build-support-wiki.py
      - run: git diff --exit-code
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test tests/support-wiki.spec.js tests/district-quickstart.spec.js tests/site-navigation.spec.js --workers=2
