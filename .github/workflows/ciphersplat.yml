name: CipherSplat compatibility
on:
  push:
    branches: [main]
    paths: ['solutions/CipherSplat/**', 'solutions/pdfsplat/src/ciphersplat-pdf.js', 'scripts/*ciphersplat*', '.github/workflows/ciphersplat.yml']
  pull_request:
    paths: ['solutions/CipherSplat/**', 'solutions/pdfsplat/src/ciphersplat-pdf.js', 'scripts/*ciphersplat*', '.github/workflows/ciphersplat.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config solutions/CipherSplat/playwright.config.js
      - run: scripts/build-ciphersplat-offline.sh
      - run: python3 -m zipfile -e solutions/CipherSplat/downloads/CipherSplat-offline.zip /tmp/ciphersplat-offline
      - run: node scripts/check-ciphersplat-offline.cjs /tmp/ciphersplat-offline/CipherSplat
      - run: git diff --exit-code -- solutions/CipherSplat
