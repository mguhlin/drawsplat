name: Refresh blog RSS snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/refresh-blog-rss.py', 'tests/test_blog_rss.py', '.github/workflows/refresh-blog-rss.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-blog-rss
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check publication, deduplication, and archive safeguards
        run: python -m unittest discover -s tests -p 'test_blog_rss.py'
      - name: Import published MGuhlin.org posts and curated entries
        run: python scripts/refresh-blog-rss.py
      - name: Commit changed entries and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- blog/drawsplat.rss; then
            echo 'No publication changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/drawsplat.rss
          git commit -m 'Refresh published DrawSplat blog entries'
          git pull --rebase origin main
          git push origin HEAD:main
          # Bot commits do not trigger ordinary Actions push workflows.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
