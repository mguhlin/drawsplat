name: District database installation
on:
  push:
    branches: [main]
    paths: ['server/mysql-backend/**', 'downloads/drawsplat-starter.sql', 'scripts/build-starter-sql.cjs', 'tests/starter-sql-ci.cjs', 'selfhost/district/**', 'start-district.*', 'start-native.*', 'scripts/install-docker-debian.sh', 'tests/*district*', 'tests/mysql-backend.test.cjs', 'tests/student-privacy.test.cjs', '.github/workflows/district-database.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mariadb, mysql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/build-starter-sql.cjs --check
      - name: Validate launch scripts
        run: |
          bash -n start-district.sh start-native.sh scripts/install-docker-debian.sh
          bash scripts/install-docker-debian.sh --help
      - name: Start with the real district launcher
        run: |
          bash start-district.sh ${{ matrix.engine == 'mysql' && '--mysql' || '' }} > /tmp/drawsplat-launcher.log 2>&1
          test -r selfhost/district/.env
          test "$(stat -c %u selfhost/district/.env)" = "$(id -u)"
      - name: Verify first-run setup and district API
        run: node tests/district-stack.mjs
      - name: Verify installation plans
        run: node --test tests/district-plan.test.cjs
      - name: Verify rerunning setup and component choices
        run: node tests/district-rerun-ci.mjs
      - name: Verify private boards, classroom isolation and roster transactions
        run: |
          npm ci --ignore-scripts --prefix server/mysql-backend
          node tests/district-database-ci.cjs
          node tests/starter-sql-ci.cjs
          node --test tests/setup-wizard.test.cjs
      - name: Verify native Node and Caddy deployment
        run: |
          docker compose --env-file selfhost/district/.env -f selfhost/district/compose.yml cp web:/usr/bin/caddy /tmp/drawsplat-native-caddy
          chmod +x /tmp/drawsplat-native-caddy
          NATIVE_TEST_CADDY=/tmp/drawsplat-native-caddy node tests/district-native-ci.mjs
      - name: Verify backup
        run: |
          bash selfhost/district/backup-district.sh
          test -s selfhost/district/backups/*/database.sql
          test -s selfhost/district/backups/*/config.json
      - name: Restore backup into an isolated database
        run: node tests/district-restore-ci.cjs
      - name: Stop test installation
        if: always()
        run: docker compose --env-file selfhost/district/.env -f selfhost/district/compose.yml down --volumes
  package-install:
    name: Extracted ZIP installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build and install the delivered package with restrictive extraction permissions
        run: |
          set -euo pipefail
          bash scripts/make-district-suite.sh
          package="dist/drawsplat-district-suite-$(git rev-parse --short HEAD).zip"
          umask 077
          mkdir -p "$RUNNER_TEMP/district-package"
          unzip -q "$package" -d "$RUNNER_TEMP/district-package"
          cd "$RUNNER_TEMP/district-package/drawsplat-district-suite/drawsplat"
          export COMPOSE_PROJECT_NAME=drawsplat-package-check
          cleanup() { docker compose --env-file selfhost/district/.env -f selfhost/district/compose.yml down --volumes >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          bash start-district.sh > "$RUNNER_TEMP/package-launch.log" 2>&1
          test -r selfhost/district/.env
          node tests/district-stack.mjs
          npm ci --ignore-scripts --prefix server/mysql-backend
          node tests/district-database-ci.cjs
          node tests/starter-sql-ci.cjs
          bash selfhost/district/backup-district.sh
          node tests/district-restore-ci.cjs
          node tests/district-rerun-ci.mjs
